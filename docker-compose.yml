services:
  # 1. Base de données MySQL
  db:
    image: mysql:8.0
    container_name: portfolio-db
    restart: always
    environment:
      MYSQL_DATABASE: Portfolio_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - portfolio_db_data:/var/lib/mysql

  # 2. Backend Laravel
  backend:
    build: 
      context: ./Backend
      dockerfile: Dockerfile
    container_name: Portfolio-api
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=Portfolio_db
      - DB_USERNAME=root
      - DB_PASSWORD=root
    command: php artisan serve --host=0.0.0.0 --port=8000

  # 3. Frontend React (Vite)
  frontend:
    build: 
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: Portfolio-ui
    ports:
      - "4200:5173" 
    depends_on:
      - backend

volumes:
  portfolio_db_data: